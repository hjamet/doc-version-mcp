[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "doc-version-mcp"
version = "0.1.0"
description = "FastMCP server for document versioning, CAS snapshots, AST diffs and AI-compliance certified artifacts"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Henri Jamet", email = "42291955+hjamet@users.noreply.github.com" }
]
dependencies = [
    "fastmcp>=0.4.0",
    "pydantic>=2.0",
    "pymupdf>=1.23.0",
]

[project.urls]
Homepage = "https://github.com/hjamet/doc-version-mcp"
Repository = "https://github.com/hjamet/doc-version-mcp"
Issues = "https://github.com/hjamet/doc-version-mcp/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
doc-version = "doc_version_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/doc_version_mcp"]
artifacts = ["mcp_metadata/*"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/mcp_metadata",
    "/README.md",
    "/pyproject.toml",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

